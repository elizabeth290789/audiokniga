plugins {
    id 'com.android.application'
}

android {
    namespace 'com.audiokniga.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.audiokniga.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    packaging {
        resources {
            merges += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'org.apache.poi:poi-scratchpad:5.5.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
